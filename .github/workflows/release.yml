name: Release
on:
  push:
    branches: [main]
    paths: [version.go, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: go test -race ./...
      - run: go vet ./...
  release:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh "$(sed -n 's/^const Version = "\(.*\)"/\1/p' version.go)"
